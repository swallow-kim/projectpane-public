[package]
name = "projectpane"
version = "1.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
default-run = "projectpane"

[lib]
name = "projectpane_core"

[[bin]]
name = "projectpane"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "projectpane-read-worker"
path = "src/bin/read-worker.rs"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-updater", "dep:semver"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-single-instance = { version = "=2.5.2", optional = true }
tauri-plugin-updater = { version = "=2.14.1", optional = true, default-features = false, features = ["rustls-tls", "system-proxy"] }
semver = { version = "1", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[target.'cfg(windows)'.dependencies]
sha2 = "=0.10.9"
crc32fast = "=1.5.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage"] }
windows-core = "=0.62.2"
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_RestartManager", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[[test]]
name = "worker_lifetime"
path = "tests/worker_lifetime.rs"
harness = false

[[test]]
name = "slow_progress"
path = "tests/slow_progress.rs"
harness = false
